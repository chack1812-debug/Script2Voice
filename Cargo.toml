[workspace]
members = [".", "crates/s2v-core", "crates/s2v-engines", "crates/s2v-audio", "crates/s2v-export", "crates/s2v-gui"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[package]
name = "script2voice"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "script2voice"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
s2v-core    = { path = "crates/s2v-core" }
s2v-engines = { path = "crates/s2v-engines" }
s2v-audio   = { path = "crates/s2v-audio" }
s2v-export  = { path = "crates/s2v-export" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
tracing-appender = "0.2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rayon = "1"
reqwest = "0.12"

[dev-dependencies]
async-trait = "0.1.89"
hound = "3.5.1"
tempfile = "3.27.0"
toml = "0.8"
